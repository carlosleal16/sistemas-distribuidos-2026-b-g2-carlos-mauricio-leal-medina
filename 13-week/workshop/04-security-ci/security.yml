# Security gates proposed for barber-saas-schedule-api (Java 21, Maven: schedule-core,
# schedule-adapters, schedule-app). Every job must pass before a pull request can be merged.
# Story: code-corhuila/barber-saas-docs#163 (STRIDE E, risk 6).
name: security

on:
  pull_request:
    branches: [develop, qa, main]

permissions:
  contents: read

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      # The gitleaks CLI in its container: the gitleaks-action needs a paid license on organization repos.
      - name: Scan the whole history for secrets
        run: >
          docker run --rm -v "${{ github.workspace }}:/repo" zricethezav/gitleaks:v8.30.1
          git /repo --redact --verbose --exit-code 1

  dependency-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: OWASP dependency-check (fails on CVSS 7 or higher)
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
        run: >
          mvn -B -ntp org.owasp:dependency-check-maven:12.1.0:aggregate
          -DfailBuildOnCVSS=7 -DnvdApiKey="$NVD_API_KEY" -Dformats=HTML,JSON

  authz-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Negative authorization tests of the weekly schedule
        run: >
          mvn -B -ntp -pl schedule-app -am test
          -Dtest=WeeklyScheduleAuthorizationHttpTest -Dsurefire.failIfNoSpecifiedTests=false
