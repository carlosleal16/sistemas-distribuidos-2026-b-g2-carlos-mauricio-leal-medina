# CP7 - Burn-rate alerts for SLO 1 (booking availability, 99.9 % over 30 days, 05-slo.md).
# Error ratio = bookings with outcome="error" / all bookings of appointment-api.
# Budget = 1 - 0.999 = 0.001. Fast burn 14.4 -> ratio > 0.0144. Slow burn 6 -> ratio > 0.006.
groups:
  - name: barbersaas-booking-slo-recording
    rules:
      - record: appointment:booking_error_ratio:rate5m
        expr: |
          sum(rate(appointment_booking_requests_total{outcome="error"}[5m]))
          /
          sum(rate(appointment_booking_requests_total[5m]))
      - record: appointment:booking_error_ratio:rate30m
        expr: |
          sum(rate(appointment_booking_requests_total{outcome="error"}[30m]))
          /
          sum(rate(appointment_booking_requests_total[30m]))
      - record: appointment:booking_error_ratio:rate1h
        expr: |
          sum(rate(appointment_booking_requests_total{outcome="error"}[1h]))
          /
          sum(rate(appointment_booking_requests_total[1h]))
      - record: appointment:booking_error_ratio:rate6h
        expr: |
          sum(rate(appointment_booking_requests_total{outcome="error"}[6h]))
          /
          sum(rate(appointment_booking_requests_total[6h]))

  - name: barbersaas-booking-slo-alerts
    rules:
      - alert: BookingAvailabilityFastBurn
        expr: |
          appointment:booking_error_ratio:rate1h > (14.4 * 0.001)
          and
          appointment:booking_error_ratio:rate5m > (14.4 * 0.001)
        for: 2m
        labels:
          severity: page
          team: barberssas
          service: appointment-api
          slo: booking-availability
        annotations:
          summary: "Bookings are failing 14.4x faster than the 99.9 % SLO allows (2 % of the monthly budget in 1 h)"
          description: "POST /api/v1/appointments error ratio is {{ $value | humanizePercentage }} over the last 5 minutes. Check schedule-api, barbershop-api and loyalty-api, the downstream calls of the booking."
          runbook_url: "https://github.com/carlosleal16/sistemas-distribuidos-2026-b-g2-carlos-mauricio-leal-medina/blob/main/11-week/workshop/07-runbook.md"

      - alert: BookingAvailabilitySlowBurn
        expr: |
          appointment:booking_error_ratio:rate6h > (6 * 0.001)
          and
          appointment:booking_error_ratio:rate30m > (6 * 0.001)
        for: 15m
        labels:
          severity: ticket
          team: barberssas
          service: appointment-api
          slo: booking-availability
        annotations:
          summary: "Bookings are failing 6x faster than the 99.9 % SLO allows (5 % of the monthly budget in 6 h)"
          description: "POST /api/v1/appointments error ratio is {{ $value | humanizePercentage }} over the last 30 minutes. Open a fix issue in barber-saas-docs and review the failed traces by trace_id."
          runbook_url: "https://github.com/carlosleal16/sistemas-distribuidos-2026-b-g2-carlos-mauricio-leal-medina/blob/main/11-week/workshop/07-runbook.md"
